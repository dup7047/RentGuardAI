name: frontend-ui-ci

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ui-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ui-ci.yml'
  schedule:
    # Nightly full browser/device matrix. Times are UTC.
    - cron: '17 8 * * *'
  workflow_dispatch:

concurrency:
  group: frontend-ui-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pr-smoke:
    name: unit + build + browser smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Run Vitest UI/component tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright smoke browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run cross-browser smoke E2E
        run: npm run e2e:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-smoke
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-smoke-traces
          path: frontend/test-results
          if-no-files-found: ignore

  nightly-full-matrix:
    name: nightly full UI matrix
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright browser matrix
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run full UI matrix
        run: npm run e2e:full

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-full
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-full-traces
          path: frontend/test-results
          if-no-files-found: ignore

  staging-smoke:
    name: deployed staging smoke
    if: github.event_name == 'workflow_dispatch' && vars.STAGING_FRONTEND_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ vars.STAGING_FRONTEND_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run staging smoke suite
        run: npm run e2e:staging -- --project=chromium-desktop --project=webkit-desktop

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-staging
          path: frontend/playwright-report
          if-no-files-found: ignore
