services:
  - type: web
    name: rentguard-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    # start:prod runs the compiled migrator first, then the server.
    # Drizzle migrations are idempotent so re-running on each deploy is safe.
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: 8080
      # Secrets prompted in the Render dashboard at first deploy.
      # `sync: false` tells Render "I'll set this in the UI."
      - key: DATABASE_URL
        sync: false   # Cloud Supabase: postgres://postgres.<ref>:<pwd>@aws-0-...supabase.com:6543/postgres
      - key: SUPABASE_JWT_SECRET
        sync: false   # Supabase: Project Settings → API → JWT Secret
      - key: SUPABASE_URL
        sync: false   # Supabase: Project Settings → API → Project URL
      - key: OPENAI_API_KEY
        sync: false   # https://platform.openai.com/api-keys (after billing top-up)
      - key: NYC_OPEN_DATA_APP_TOKEN
        sync: false   # Optional but recommended (raises rate limit 1k→10k/hr)
      - key: FIRECRAWL_API_KEY
        sync: false   # Phase 4 — listing-scraping fallback (500 credits free, $19/mo for 3k)
      - key: RESEND_API_KEY
        sync: false   # Resend API key. Used (1) by Supabase via `supabase config push` for auth emails AND (2) by the backend at runtime for transactional sends (e.g. account-deletion undo email — Phase 11.7). Stub-safe: if unset, the backend logs and returns ok.
      - key: RESEND_FROM
        sync: false   # Optional. Override the default "RentGuard NYC <hello@rentguard.cc>" sender. Set if your verified Resend domain differs.
      - key: ACCOUNT_UNDO_SECRET
        sync: false   # ≥32-char random string (e.g. `openssl rand -base64 48`). Signs the 30-day undo-delete JWT (Phase 11.7). Rotating it invalidates all in-flight undo links.
      - key: PUBLIC_APP_ORIGIN
        value: https://www.rentguard.cc
      # Beehiiv is stub-safe — the route returns ok:true without these set.
      # Add only if you want real waitlist enrollment.
      # - key: BEEHIIV_API_KEY
      #   sync: false
      # - key: BEEHIIV_PUBLICATION_ID
      #   sync: false
