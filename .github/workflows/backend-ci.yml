name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'supabase/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'supabase/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + unit + migrate against local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        working-directory: ${{ github.workspace }}
        run: supabase start

      - name: Apply Drizzle migrations against local Supabase
        run: npm run migrate

      - name: Run tests (includes migrate integration suite)
        run: npm test

      - name: Stop local Supabase stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: supabase stop || true
